<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../CSS/reset-pass.css">
</head>
<body>
    <section class="section1">
        <img src="../images/signin.jpg">

        <div class="form">
            <div class="circle">
                <div class="circle1">
                    <h2>C</h2>
                </div>
            </div>
            <h1 class="box1">Reset Your Password</h1>
            
            <div class="points">
                <div class="one">
                    <i class="fa-solid fa-circle-check"></i>
                    <p>Choose a strong password</p>
                </div>
                <div class="two">
                    <i class="fa-solid fa-circle-check"></i>
                    <p>Keep your account secure</p>
                </div>
                <div class="three">
                    <i class="fa-solid fa-circle-check"></i>
                    <p>Get back to your health journey</p>
                </div>
            </div>


            <div class="info">
                <h1>Reset Password</h1>
                <p class="log">Enter your new password below</p>
                <div class="lock-icon">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="New Password">
                </div>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Confirm Password">
                </div>
                <button class="signup-btn">RESET PASSWORD</button>
                <a href="./login.html">Back to Login</a>
            </div>

            
        </div>

        
    </section>
</body>
</html>
