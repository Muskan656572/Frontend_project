<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>
    <nav class="navbar">
        <a href="./home.html">Home</a>
        <a href="./about.html">About Us</a>
        <a href="./services.html">Services</a>
        <a href="./doctors.html">Doctors</a>
        <a href="./contact.html">Contact</a>

        <div class="nav-user">

    <!-- Login nahi hai -->
    <a href="./signin.html" id="signInLink">
        <button class="btn">Sign In</button>
    </a>

    <!-- Login hai -->
    <div class="user-menu" id="userMenu">

        <!-- User ka first letter -->
        <button class="user-letter" id="userLetter">
            
        </button>

        <!-- Click karne par ye dropdown open hoga -->
        <div class="dropdown" id="userDropdown">

            <a href="#" id="dashboardLink">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>

            <button id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>

            <button id="deleteAccountBtn">
                <i class="fa-solid fa-trash"></i>
                Delete Account
            </button>

        </div>

    </div>

</div>
    </nav>

    <section class="section1">
        <img src="../images/signin.jpg">

        <div class="form">
            <div class="circle">
                <div class="circle1">
                    <h2>C</h2>
                </div>
            </div>
            <h1>Welcome Back</h1>
            
            <div class="points">
                <div class="one">
                    <i class="fa-solid fa-circle-check"></i>
                    <p>Access your account</p>
                </div>
                <div class="two">
                    <i class="fa-solid fa-circle-check"></i>
                    <p>Manage your appointments</p>
                </div>
                <div class="three">
                    <i class="fa-solid fa-circle-check"></i>
                    <p>Connect with doctors</p>
                </div>
            </div>


            <div class="info">
                <h1>Welcome Back!</h1>

                <p class="log">Login to your CarePlus account</p>

                <form id="loginForm">

                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input
                            type="email"
                            id="email"
                            placeholder="Email Address"
                            required
                        >
                    </div>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input
                            type="password"
                            id="password"
                            placeholder="Password"
                            required
                        >
                    </div>

                    <div class="forgot">
                        <a href="./reset-pass.html">Forgot Password?</a>
                    </div>

                    <p id="error-message"></p>

                    <button type="submit" class="signup-btn">LOGIN</button>

                </form>

                <p class="log1">Don't have an account? <a href="./signin.html">Sign Up</a></p>
            </div>

        </div>

        
    </section>
    <script src="../JS/login.js"></script>
    <script src="../JS/navbar.js"></script>
</body>
</html>
