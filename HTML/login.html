<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>
    <nav class="navbar">
        <a href="./home.html">Home</a>
        <a href="./about.html">About Us</a>
        <a href="./services.html">Services</a>
        <a href="">Why Us</a>
        <a href="">Pricing</a>

        <a href="./signin.html"><button class="btn" onclick="">Sign In</button></a>
    </nav>

    <section class="section1">
        <img src="../images/signin.jpg">

        <div class="form">
            <div class="circle">
                <div class="circle1">
                    <h2>C</h2>
                </div>
            </div>
            <h1>Welcome Back</h1>
            
            <div class="points">
                <div class="one">
                    <i class="fa-solid fa-circle-check"></i>
                    <p>Access your account</p>
                </div>
                <div class="two">
                    <i class="fa-solid fa-circle-check"></i>
                    <p>Manage your appointments</p>
                </div>
                <div class="three">
                    <i class="fa-solid fa-circle-check"></i>
                    <p>Connect with doctors</p>
                </div>
            </div>


            <div class="info">
                <h1>Welcome Back!</h1>
                <p class="log">Login to your CarePlus account</p>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" placeholder="Email Address">
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Password">
                </div>
                <div class="forgot">
                    <a href="./reset-pass.html">Forgot Password?</a>
                </div>
                <button class="signup-btn">LOGIN</button>
                <p>Don't have an account?  <a href="./signin.html"> Sign Up</a></p>
            </div>

            
        </div>

        
    </section>
    <script src="../JS/login.js"></script>
</body>
</html>
