<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../CSS/signin.css">
    
</head>
<body>
    <nav class="navbar">
        <a href="./home.html">Home</a>
        <a href="./about.html">About Us</a>
        <a href="./services.html">Services</a>
        <a href="./doctors.html">Doctors</a>
        <a href="./contact.html">Contact</a>

        <div class="nav-user">

    <!-- Login nahi hai -->
    <a href="./signin.html" id="signInLink">
        <button class="btn">Sign In</button>
    </a>

    <!-- Login hai -->
    <div class="user-menu" id="userMenu">

        <!-- User ka first letter -->
        <button class="user-letter" id="userLetter">
            
        </button>

        <!-- Click karne par ye dropdown open hoga -->
        <div class="dropdown" id="userDropdown">

            <a href="#" id="dashboardLink">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>

            <button id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>

            <button id="deleteAccountBtn">
                <i class="fa-solid fa-trash"></i>
                Delete Account
            </button>

        </div>

    </div>

</div>
    </nav>

    <section class="section1">
        <img src="../images/signin.jpg">

        <div class="form">
            <div class="circle">
                <div class="circle1">
                    <h2>C</h2>
                </div>
            </div>
            <h1>Sign Up</h1>
            
            <div class="points">
                <div class="one">
                    <i class="fa-solid fa-circle-check"></i>
                    <p>Enjoy personalized healthcare benefits</p>
                </div>
                <div class="two">
                    <i class="fa-solid fa-circle-check"></i>
                    <p>Personalize your favourites</p>
                </div>
                <div class="three">
                    <i class="fa-solid fa-circle-check"></i>
                    <p>Book appointments</p>
                </div>
            </div>

            <div class="info">

                <h1>Create Your Account</h1>

                <form id="signupForm">

                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="name" placeholder="Full Name" required>
                    </div>

                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="Email Address" required>
                    </div>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Create Password" required>
                    </div>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                    </div>

                    <div class="input-box">
                        <i class="fa-solid fa-user-tag"></i>

                        <select id="role" required>
                            <option value="">Select Role</option>
                            <option value="patient">Patient</option>
                            <option value="doctor">Doctor</option>
                        </select>
                    </div>

                    <p id="error-message"></p>

                    <button type="submit" class="signup-btn">SIGN UP</button>

                </form>

                <p>Already have an account?
                    <a href="./login.html">Log In</a>
                </p>

            </div>

            
            
        </div>

        
    </section>
    <script src="../JS/signin.js"></script>
</body>
</html>
